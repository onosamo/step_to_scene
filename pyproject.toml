[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "step-to-scene"
version = "0.1.0"
description = "CLI tool to convert large robotic cells from STEP files to URDF/XACRO/SDF"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache 2.0"}
authors = [
    {name = "szobov"}
]
keywords = ["robotics", "STEP", "URDF", "XACRO", "SDF", "CAD", "conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "textual>=0.40.0",
    "cadquery>=2.4.0",
    "trimesh[recommend]>=4.0.0",
    "numpy>=1.20.0",
    "typer>=0.20.0",
    "vhacdx>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
step-to-scene = "step_to_scene.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["step_to_scene"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "pytest-sugar>=1.1.1",
    "ruff>=0.1.0",
]
