[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "step-to-scene"
version = "0.1.0"
description = "CLI tool to convert large robotic cells from STEP files to URDF/XACRO/SDF"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache 2.0"}
authors = [
    {name = "szobov"}
]
keywords = ["robotics", "STEP", "URDF", "XACRO", "SDF", "CAD", "conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "textual>=0.40.0",
    "lxml>=4.9.0",
    "cadquery>=2.4.0",
    "trimesh[recommend]>=4.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
step-to-scene = "step_to_scene.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["step_to_scene"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4.2",
]
